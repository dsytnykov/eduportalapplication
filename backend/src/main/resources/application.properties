spring.application.name=eduportalapplication
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5432/eduportal
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

contentful.space-id=${CONTENTFULL_SPACE_ID}
contentful.access-token=${CONTENTFUL_ACCESS_TOKEN}
contentful.environment=${CONTENTFUL_ENVIRONMENT:master}

firebase.service-account=${FIREBASE_SERVICE_ACCOUNT_PATH}
firebase.database-url=${FIREBASE_DATABASE_URL}

spring.cache.cache-names=courses,sections,lessons
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m

logging.level.root=INFO
logging.level.com.eduportal=DEBUG
logging.level.org.springframework.security=INFO

contentful.sync.cron=0 0 * * * *
